name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout koda
            uses: actions/checkout@v4

          - name: Podesavanje Python okruzenja
            uses: actions/setup-python@v5
            with:
              python-version: '3.10'

          - name: Instalacija zavisnosti i Lintera
            run: |
                python -m pip install --upgrade pip
                pip install flake8
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          - name: provera koda sa Flake8 linting
            run: |
                flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    build-and-push:
            needs: lint-and-test
            runs-on: ubuntu-latest
            steps:
                - name: Checkout koda
                  uses: actions/checkout@v4

                - name: Prijava na Docker Hub
                  uses: docker/login-action@v3
                  with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

                - name: Build and Push Docker Image
                  uses: docker/build-push-action@v5
                  with:
                    context: .
                    push: true
                    tags: ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest

    deploy-to-ec2:
            needs: build-and-push
            runs-on: ubuntu-latest
            steps:
                - name: Povezivanje preko SSH i pokretanje na EC2
                  uses: appleboy/ssh-action@v1.0.3
                  with:
                    host: ${{ secrets.EC2_HOST }}
                    username: ${{ secrets.EC2_USERNAME }}
                    key: ${{ secrets.EC2_SSH_KEY }}
                    script: |
                        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
                        docker stop flask-devops-app || true
                        docker rm flask-devops-app || true
                        docker pull ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest
                        docker run -d \
                            --name flask-devops-app \
                            -p 5000:5000 \
                            ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest
                            